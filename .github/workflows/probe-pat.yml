name: Probe PAT Scope
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT write access to each target repo
        env:
          GH_TOKEN: ${{ secrets.TERMIX_PAT }}
        run: |
          for r in Termix-SSH/Docs Termix-SSH/Termix Termix-SSH/Mobile Termix-SSH/Support Termix-SSH/CLI Termix-SSH/.github LukeGus/LukeGus; do
            perm=$(gh api "repos/$r" --jq '.permissions.push' 2>/dev/null || echo "NO-ACCESS")
            printf "%-24s push=%s\n" "$r" "$perm"
          done
          echo "--- token identity ---"
          gh api user --jq '.login'
