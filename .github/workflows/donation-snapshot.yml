name: Monthly Donation Snapshot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: ci
    permissions:
      contents: write
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Docs
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Fetch donation totals
        run: |
          set -e

          curl -sf --max-time 30 \
            -o /tmp/donations.json \
            "https://donations.termix.site/api/donations"

          python3 - <<'PY'
          import json

          with open('/tmp/donations.json') as f:
              d = json.load(f)

          with open('static/donation-snapshot.json', 'w') as f:
              json.dump({
                  'month': d['month'],
                  'currency': 'usd',
                  'fiatTotal': d.get('monthly_total_usd', 0),
                  'updatedAt': d.get('updated_at'),
              }, f, indent=2)
              f.write('\n')

          with open('static/donation-total.json', 'w') as f:
              json.dump({
                  'currency': 'usd',
                  'total': d.get('all_time_total_usd', 0),
                  'updatedAt': d.get('updated_at'),
              }, f, indent=2)
              f.write('\n')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet static/donation-snapshot.json static/donation-total.json; then
            echo "Snapshot unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/donation-snapshot.json static/donation-total.json
          git commit -m "chore: update donation snapshot $(date -u +%Y-%m)"
          git push
