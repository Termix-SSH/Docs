name: Monthly Donation Snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TERMIX_PAT }}

      - name: Fetch donation totals
        run: |
          set -e

          curl -sf --max-time 30 \
            -o /tmp/donations.json \
            "http://50.116.23.234:4000/api/donations"

          python3 - <<'PY'
          import json

          with open('/tmp/donations.json') as f:
              d = json.load(f)

          with open('static/donation-snapshot.json', 'w') as f:
              json.dump({
                  'month': d['month'],
                  'currency': 'usd',
                  'fiatTotal': d.get('monthly_total_usd', 0),
                  'updatedAt': d.get('updated_at'),
              }, f, indent=2)
              f.write('\n')

          with open('static/donation-total.json', 'w') as f:
              json.dump({
                  'currency': 'usd',
                  'total': d.get('all_time_total_usd', 0),
                  'updatedAt': d.get('updated_at'),
              }, f, indent=2)
              f.write('\n')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet static/donation-snapshot.json static/donation-total.json; then
            echo "Snapshot unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/donation-snapshot.json static/donation-total.json
          git commit -m "chore: update donation snapshot $(date -u +%Y-%m)"
          git push
