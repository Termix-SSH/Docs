name: Check Sponsor Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "static/sponsors.json"
      - "static/img/sponsors/**"
      - "scripts/check-sponsors.mjs"

permissions: {}

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Check sponsor links
        id: check
        run: |
          set -o pipefail
          node scripts/check-sponsors.mjs 2>&1 | tee /tmp/sponsor-check.log

      - name: Open an issue if a link is dead
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/sponsor-check.log', 'utf8');
            const title = 'Sponsor link check failed';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sponsors',
            });

            const body = [
              'The weekly sponsor link check failed. A sponsor site or logo may be down.',
              '',
              '```',
              log.slice(-4000),
              '```',
              '',
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['sponsors'],
              });
            }
