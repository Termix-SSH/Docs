name: Sync Docs

# Pulls every official plugin's docs (latest from main), the API specs, the env
# var list and the app downloads, then commits what changed. The push
# redeploys the site.

on:
  repository_dispatch:
    types: [registry-updated, core-released]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: ci
    # The push goes through the App token.
    permissions:
      contents: read
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Docs
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          # The commit step pushes with it.
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      # The sync builds API specs with the SDK's generator.
      # Our own package, always the newest release on purpose.
      - run: npm install --no-save @termix-ssh/plugin-sdk@latest # zizmor: ignore[adhoc-packages]

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run sync

      - run: npm run gen-api

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Check app links
        run: npm run check-links

      - name: Commit
        run: |
          git add plugins develop/reference api static/openapi src/data sidebars-plugins.js
          if git diff --cached --quiet; then
            echo "Docs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync plugin docs"
          git push
